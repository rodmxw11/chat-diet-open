openapi: 3.0.3
info:
  title: chat-diet API
  description: >
    HTTP surface for chat-diet's Spring Boot backend. Most functionality (logging food,
    weight, exercise, shopping, etc.) is driven through the single /api/chat endpoint via
    the model's tool-calling framework rather than dedicated REST routes; the remaining
    endpoints below handle barcode input, file downloads, the header/dashboard/shopping
    screens, and connectivity that don't fit that model.
  version: "0.0.1"
servers:
  - url: http://localhost:8080

tags:
  - name: chat
    description: Conversational turn endpoint
  - name: barcode
    description: Barcode decoding from a product photo
  - name: export
    description: Full database export
  - name: sql
    description: SQL agent result downloads
  - name: summary
    description: Today-at-a-glance header summary
  - name: shopping
    description: Dedicated in-store shopping checklist screen
  - name: dashboard
    description: Macro and weight-trend chart data
  - name: system
    description: Connectivity heartbeat

paths:
  /api/chat:
    post:
      tags: [chat]
      summary: Send a chat turn
      description: >
        Accepts a plain-text turn. Routes the message through the model and returns its
        reply, plus any chart series, SQL answer, or food-item picker options produced as a
        side effect of tool calls made during this turn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Model reply, with optional chart/SQL/food-item-picker results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'

  /api/chat/history:
    get:
      tags: [chat]
      summary: Get the current metabolic day's conversation
      description: >
        Returns the whole conversation for the metabolic day in progress, oldest first.
        There is no session concept - the day is the conversation - so any device asking
        gets the same thread, which is how a reload or a second device restores the
        transcript. Text only: chart series, SQL result tables, and photo attachments are
        not persisted and so are absent from restored history.
      responses:
        '200':
          description: The day's messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatHistoryResponse'

  /api/barcode/decode:
    post:
      tags: [barcode]
      summary: Decode a barcode from an uploaded photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Uploaded product photo containing a barcode
      responses:
        '200':
          description: Barcode decoded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarcodeDecodeResponse'
        '404':
          description: No barcode could be decoded from the image

  /api/export:
    get:
      tags: [export]
      summary: Download a full database + photo export archive
      description: Builds a fresh export archive on demand and streams it as a file attachment.
      responses:
        '200':
          description: ZIP archive containing the database export and stored photos
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="chat-diet-export-<date>.zip"'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/summary/today:
    get:
      tags: [summary]
      summary: Today-at-a-glance calorie summary
      description: Polled by the header. target/remaining are null if no goal has ever been set.
      responses:
        '200':
          description: Today's summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodaySummary'

  /api/shopping-items:
    get:
      tags: [shopping]
      summary: List all shopping items
      description: Pending items first, then purchased; each group chronological.
      responses:
        '200':
          description: Shopping items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShoppingItem'

  /api/shopping-items/{id}/toggle:
    post:
      tags: [shopping]
      summary: Toggle a shopping item between pending and purchased
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The updated item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingItem'

  /api/dashboard/macros:
    get:
      tags: [dashboard]
      summary: Per-day macro breakdown
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            enum: [7, 30]
            default: 7
      responses:
        '200':
          description: One entry per metabolic day, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyMacros'

  /api/dashboard/weight-trend:
    get:
      tags: [dashboard]
      summary: 30-day weight trend (actual, smoothed, goal line)
      responses:
        '200':
          description: Weight trend data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightTrendResponse'

  /api/ping:
    get:
      tags: [system]
      summary: Connectivity heartbeat
      description: Trivial no-DB-touch endpoint the frontend polls to detect online/offline.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string

  /api/sql-results/{id}/csv:
    get:
      tags: [sql]
      summary: Download the full (uncapped) result of a previously run SQL agent query
      description: >
        Chat responses inline a display-capped preview of SQL agent results
        (see ChatResponse.sqlAnswer). This endpoint streams the full, uncapped result set as
        CSV, keyed by the csvId returned with that preview.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: csvId from a previous ChatResponse.sqlAnswer
      responses:
        '200':
          description: CSV file
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="query-result.csv"'
          content:
            text/csv:
              schema:
                type: string
        '404':
          description: No result cached under this id (it may have expired from the bounded cache)

components:
  schemas:
    ChatRequest:
      type: object
      properties:
        text:
          type: string
          description: The user's message text
        clientSentAt:
          type: string
          format: date-time
          nullable: true
          description: >
            ISO-8601 timestamp of when the user actually hit send, not when the request
            reached the server. Determines which metabolic day the turn is filed under and
            what timestamp it is stored with, and is used to backdate logged entries when a
            message was queued offline and replayed later. Timestamps in the future are
            clamped to now. Defaults to the server's clock when omitted.
      required: [text]

    ChatHistoryResponse:
      type: object
      properties:
        metabolicDate:
          type: string
          format: date
          description: The metabolic day these messages belong to
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant]
              text:
                type: string
              at:
                type: string
                format: date-time
                description: When the message was composed, not when the server received it
            required: [role, text, at]
      required: [metabolicDate, messages]

    ChatResponse:
      type: object
      properties:
        reply:
          type: string
        chartSeries:
          type: array
          nullable: true
          description: Present only when the model invoked show_chart during this turn
          items:
            $ref: '#/components/schemas/ChartSeries'
        sqlAnswer:
          allOf:
            - $ref: '#/components/schemas/SqlAnswer'
          nullable: true
          description: Present only when the model invoked a SQL query tool during this turn
        foodItemOptions:
          type: array
          nullable: true
          description: Present only when the model invoked list_food_items_for_shopping during this turn
          items:
            $ref: '#/components/schemas/FoodItemOption'

    FoodItemOption:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        typicalServingG:
          type: number
          format: double
          nullable: true

    TodaySummary:
      type: object
      properties:
        metabolicDate:
          type: string
          format: date
        targetCalories:
          type: integer
          nullable: true
          description: Null if no goal has ever been set
        consumedCalories:
          type: integer
        remainingCalories:
          type: integer
          nullable: true
          description: Null if no goal has ever been set
        entryCount:
          type: integer
          description: Number of food_entry rows logged today

    ShoppingItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        foodItemId:
          type: integer
          format: int64
          nullable: true
        suggestedStore:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, PURCHASED]
        addedAt:
          type: string
          format: date-time
        purchasedAt:
          type: string
          format: date-time
          nullable: true

    DailyMacros:
      type: object
      properties:
        date:
          type: string
          format: date
        proteinG:
          type: number
          format: double
        carbsG:
          type: number
          format: double
        fatG:
          type: number
          format: double
        calories:
          type: integer

    WeighIn:
      type: object
      properties:
        date:
          type: string
          format: date
        weightLbs:
          type: number
          format: double

    TrendPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        value:
          type: number
          format: double

    GoalLine:
      type: object
      description: Straight-line goal trajectory; the frontend draws the line from these parameters.
      properties:
        startDate:
          type: string
          format: date
        startWeightLbs:
          type: number
          format: double
        dailyRateLbs:
          type: number
          format: double

    WeightTrendResponse:
      type: object
      properties:
        actual:
          type: array
          items:
            $ref: '#/components/schemas/WeighIn'
        smoothed:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
        goal:
          allOf:
            - $ref: '#/components/schemas/GoalLine'
          nullable: true
          description: Null if no weigh-in has ever been logged

    ChartSeries:
      type: object
      properties:
        label:
          type: string
          example: Calories
        points:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'

    SeriesPoint:
      type: object
      properties:
        at:
          type: string
          format: date-time
        value:
          type: number
          format: double
        target:
          type: number
          format: double
          nullable: true
          description: Goal value at this point, or null when the series has no goal overlay

    SqlAnswer:
      type: object
      properties:
        sqlText:
          type: string
          description: The SQL that was executed
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          description: Up to a display cap of rows for inline rendering
          items:
            type: array
            items: {}
        truncated:
          type: boolean
          description: Whether rows was capped and doesn't contain every matching row
        totalRows:
          type: integer
          description: True number of rows the query matched, regardless of truncation
        csvId:
          type: string
          description: Key for downloading the full, uncapped result via /api/sql-results/{id}/csv

    BarcodeDecodeResponse:
      type: object
      properties:
        upc:
          type: string
