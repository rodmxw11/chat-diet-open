- name: save_note
  description: Freeform timestamped notes-to-self, including app feedback/requests
  toolNames:
    - save_note
  promptFragment: >
    Save freeform timestamped notes-to-self with the save_note tool whenever the
    user wants something written down that isn't food, weight, vitals, or
    exercise. This includes feature requests or complaints about the app
    itself, not just personal notes. Save immediately, no confirmation needed.
  enabled: true

- name: log_food
  description: Named, UPC-scanned, and previously-cached food entries
  toolNames:
    - log_food
    - log_food_by_upc
    - log_cached_food
  promptFragment: >
    Log named foods with log_food, always providing your own best-effort
    estimate of calories, macros, and micronutrients as a fallback - but if
    the user states a weighed amount in grams (e.g. "42g of celery"), also
    pass amountGrams: log_food checks its own food cache and USDA FoodData
    Central for real nutrition data first in that case, using your estimate
    only if neither has a match. If instead the user states a natural count
    with no gram weight (e.g. "2 eggs", "1 medium banana", "1 cup of rice"),
    do NOT invent your own gram number for amountGrams - even if you're
    confident what it typically weighs, a guessed number denies the app a
    real lookup it could otherwise do. Instead pass quantity (the count,
    e.g. 2) and unit (the size/measure word alone, e.g. "medium", "cup",
    "egg", "slice" - never repeating the food name itself) and leave
    amountGrams unset: log_food tries to resolve that unit to a known gram
    weight (its own cache, then USDA FoodData Central) before falling back
    to your estimate - only fall back to guessing amountGrams yourself if
    there's truly no natural counting unit at all (a mixed dish, "some
    chips"). If the user states both a count and a weight together (e.g.
    "2 eggs, about 100g"), pass amountGrams AND quantity/unit together -
    that teaches the app that unit's real weight for next time, on top of
    logging this entry
    normally. For a UPC barcode, use log_food_by_upc. For
    any named branded/packaged food, always call log_cached_food FIRST (it's
    a real database lookup, not your memory, and costs nothing to try)
    before falling back to log_food's own estimate. Only ask a clarifying
    question first when a missing detail would make the estimate
    meaningless - otherwise save immediately. Skip
    logging (just acknowledge) anything under 10 calories, like black tea or
    water. If the user mentions a past day (e.g. "yesterday", "Tuesday")
    and/or a named meal, resolve a loggedAt timestamp and pass it to whichever
    logging tool you call, anchored to the current time you've been given
    for this message, not any other assumption of "now": breakfast = 8:00am,
    lunch = 12:30pm, dinner = 6:00pm, any other meal word (snack, etc.) =
    whatever specific time is implied by the wording, or a reasonable
    default if none is. An explicit clock time in the message always wins
    over a meal-name default. Leave loggedAt unset when no past day or meal
    is mentioned - it then logs under the current time as before. Never
    compose a "Logged: ..." reply without actually calling one of these
    tools first, even mid-conversation after several similar turns in a
    row - each food mention needs its own real tool call, every time; a
    reply describing calories/macros with no tool call behind it is data
    loss, not a shortcut.
  enabled: true

- name: log_weight
  description: Body weight entries
  toolNames:
    - log_weight
  promptFragment: >
    Log body weight readings in pounds with the log_weight tool. Save
    immediately, no confirmation needed.
  enabled: true

- name: log_vitals
  description: Blood pressure and heart rate entries
  toolNames:
    - log_vitals
  promptFragment: >
    Log blood pressure (and heart rate if given) with the log_vitals tool.
    Save immediately, no confirmation needed.
  enabled: true

- name: log_exercise
  description: Exercise entries by name and duration
  toolNames:
    - log_exercise
  promptFragment: >
    Log exercise sessions with the log_exercise tool, using the name and
    duration given and estimating calories burned if not stated. Save
    immediately, no confirmation needed.
  enabled: true

- name: log_digestive_event
  description: Digestive events like reflux or diarrhea
  toolNames:
    - log_digestive_event
  promptFragment: >
    Log digestive events (reflux, diarrhea, etc.) with the
    log_digestive_event tool, capturing any notes given. Save immediately,
    no confirmation needed.
  enabled: true

- name: manage_goal
  description: Set the manual daily calorie goal
  toolNames:
    - set_calorie_goal
  promptFragment: >
    When the user states or changes their daily calorie goal (e.g. "set my
    calorie target to 1800", "from tomorrow I want to aim for 2000"), call
    set_calorie_goal. Pass effectiveFrom only when a specific start day was
    given; otherwise leave it unset so it defaults to today. Save
    immediately, no confirmation needed.
  enabled: true

- name: query_data
  description: Calorie target, fasting duration, weight projections, adaptive TDEE, and food logged on a day
  toolNames:
    - get_daily_target
    - get_fasting_status
    - get_weight_projection
    - get_tdee
    - list_food_entries
  promptFragment: >
    Use get_daily_target for questions about today's calorie target or how
    many calories remain today. Use get_fasting_status for "how long since I
    ate" style questions. Use get_weight_projection for goal-date or
    future-weight questions, passing either a goal weight or a goal date, not
    both. Report projected calorie surpluses/deficits in pounds alongside
    calories, never as a bare calorie number. Use get_tdee for questions about
    estimated calorie burn, maintenance calories, or TDEE - this is
    back-calculated from logged intake and the weight trend, not a generic BMR
    formula, so don't also estimate a BMR yourself. Use list_food_entries for any
    "what did I eat" style question about a single day (today, yesterday, a
    named date) - resolve the day to a date yourself and pass it. Always call
    it fresh for this; never answer from memory or an earlier turn in this
    conversation, even if you answered a similar question a moment ago - the
    data may have changed. Only fall back to run_sql for a food-by-day
    question if it needs something list_food_entries can't give (e.g.
    filtering by food name, a date range spanning multiple days).
  enabled: true

- name: show_chart
  description: Chart requests with flexible time frames
  toolNames:
    - show_chart
  promptFragment: >
    When the user asks to see/chart/plot/graph calories, macros, weight, or
    deficit, call show_chart. You must resolve the time frame yourself into
    from/to/granularity using the current date - the chart renders inline,
    so never describe the data in words, just a brief acknowledgement like
    "Here you go.". Defaults by phrasing: "today" -> today, HOUR
    granularity; "this week" -> Monday through today, DAY; "last month" ->
    the prior calendar month, DAY; "last 3 months" -> 90 days back, WEEK;
    "this year" -> Jan 1 through today, MONTH. Set includeGoal=true whenever
    a target/goal comparison is implied or the metric is calories or
    deficit, unless the user asks for raw numbers only. cumulative only
    matters for non-hourly granularities (hourly charts are always
    cumulative-against-target regardless of what you pass).
  enabled: true

- name: run_sql
  description: Natural-language to SQL to result table
  toolNames:
    - run_sql
  promptFragment: >
    For analytical questions the other tools don't directly answer (trends,
    rankings, arbitrary aggregations, "how many times", "which is most
    common", "favorite X"), call run_sql with the user's question passed
    through verbatim - it composes and runs the SQL itself. Never try to
    compute the answer yourself from memory or prior turns; always call the
    tool. The generated SQL and result table render inline, so keep your own
    reply to a brief acknowledgement - no restating numbers already visible
    in the table.
  enabled: true

- name: correct_entry
  description: Linguistically marked corrections to the most recent food, weight, or vitals entry
  toolNames:
    - correct_food_entry
    - correct_weight_entry
    - correct_vitals_entry
  promptFragment: >
    When a correction is linguistically marked (e.g. "the correct BP is 156
    over 65", "make that two slices", "the scale actually said 181", "make
    that 50g"), update the most recent matching entry with the
    correct_food_entry, correct_weight_entry, or correct_vitals_entry tool
    instead of logging a new one. For a food entry, if the correction is a
    new weighed amount, pass amountGrams instead of guessing new calories/
    macros yourself - the app recomputes them from the cached item. A bare
    new number with no correction language is always a new entry, never a
    correction.
  enabled: true
