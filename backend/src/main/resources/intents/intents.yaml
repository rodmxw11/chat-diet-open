- name: save_note
  description: Freeform timestamped notes-to-self
  toolNames:
    - save_note
  promptFragment: >
    Save freeform notes-to-self with the save_note tool whenever the user
    wants something written down that isn't food, weight, vitals, or
    exercise. Save immediately, no confirmation needed.
  enabled: true

- name: log_food
  description: Named, UPC-scanned, and previously-cached food entries
  toolNames:
    - log_food
    - log_food_by_upc
    - log_cached_food
    - analyze_food_photo
    - log_food_from_photo
    - find_recipe
    - log_recipe
  promptFragment: >
    Log named foods with log_food, estimating calories and macros yourself.
    For a UPC barcode, use log_food_by_upc. For any named branded/packaged
    food, always call log_cached_food FIRST (it's a real database lookup, not
    your memory, and costs nothing to try) before falling back to log_food's
    own estimate. If a photo is attached, call analyze_food_photo; on a
    confident result, immediately call log_food_from_photo with those
    numbers; on a clarifying question, ask it and wait, then scale the
    numbers yourself arithmetically next turn (never re-analyze the photo)
    and call log_food_from_photo. For a known dish name, call find_recipe
    first; on a match, quiz only its variable ingredients and any extras,
    compute final totals yourself, and call log_recipe - if it finds nothing,
    treat it as a new dish (recipe_intake) instead. Only ask a clarifying
    question first when a missing detail would make the estimate
    meaningless - otherwise save immediately. Skip logging (just
    acknowledge) anything under 10 calories, like black tea or water.
    If the user mentions a past day (e.g. "yesterday", "Tuesday") and/or a
    named meal, resolve a loggedAt timestamp and pass it to whichever
    logging tool you call, anchored to the current time you've been given
    for this message, not any other assumption of "now": breakfast = 8:00am,
    lunch = 12:30pm, dinner = 6:00pm, any other meal word (snack, etc.) =
    whatever specific time is implied by the wording, or a reasonable
    default if none is. An explicit clock time in the message always wins
    over a meal-name default. Leave loggedAt unset when no past day or meal
    is mentioned - it then logs under the current time as before.
  enabled: true

- name: log_weight
  description: Body weight entries
  toolNames:
    - log_weight
  promptFragment: >
    Log body weight readings in pounds with the log_weight tool. Save
    immediately, no confirmation needed.
  enabled: true

- name: log_vitals
  description: Blood pressure and heart rate entries
  toolNames:
    - log_vitals
  promptFragment: >
    Log blood pressure (and heart rate if given) with the log_vitals tool.
    Save immediately, no confirmation needed.
  enabled: true

- name: log_exercise
  description: Exercise entries by name and duration
  toolNames:
    - log_exercise
  promptFragment: >
    Log exercise sessions with the log_exercise tool, using the name and
    duration given and estimating calories burned if not stated. Save
    immediately, no confirmation needed.
  enabled: true

- name: log_digestive_event
  description: Digestive events like reflux or diarrhea
  toolNames:
    - log_digestive_event
  promptFragment: >
    Log digestive events (reflux, diarrhea, etc.) with the
    log_digestive_event tool, capturing any notes given. Save immediately,
    no confirmation needed.
  enabled: true

- name: capture_requirement
  description: Feature requests or complaints about the app itself
  toolNames:
    - save_requirement
  promptFragment: >
    When the user requests a new app feature or complains about how the app
    behaves, save it with the save_requirement tool, summarizing it
    concisely. This is about the app, not about diet/weight/vitals data.
  enabled: true

- name: query_data
  description: Calorie target, fasting duration, and weight projections
  toolNames:
    - get_daily_target
    - get_fasting_status
    - get_weight_projection
  promptFragment: >
    Use get_daily_target for questions about today's calorie target or how
    many calories remain today. Use get_fasting_status for "how long since I
    ate" style questions. Use get_weight_projection for goal-date or
    future-weight questions, passing either a goal weight or a goal date, not
    both. Report projected calorie surpluses/deficits in pounds alongside
    calories, never as a bare calorie number.
  enabled: true

- name: recipe_intake
  description: Onboard an unknown dish as a reusable recipe; edit or delete existing recipes
  toolNames:
    - find_recipe
    - create_recipe
    - refine_recipe
    - delete_recipe
    - list_stale_recipes
  promptFragment: >
    When the user names an unknown dish or says "new recipe", call
    find_recipe first, then create_recipe from pot-level ingredients and
    total weight when available, or from one weighed serving's totals with
    provisional=true otherwise. Ask only a few high-impact clarifying
    questions (e.g. ground beef leanness), not an exhaustive ingredient
    list. Use refine_recipe to improve a provisional recipe later (forward-
    only, never touches past entries), list_stale_recipes to surface
    recipes logged once and never reused, and delete_recipe once the user
    confirms.
  enabled: true

- name: manage_shopping
  description: Add, list, and mark shopping list items as purchased
  toolNames:
    - add_shopping_item
    - list_shopping_items
    - mark_shopping_item_purchased
  promptFragment: >
    Add items to the shopping list with add_shopping_item whenever the user
    says they need to buy something (a suggested store is filled in
    automatically from purchase history, so never ask which store). Use
    list_shopping_items when they ask what's on the list. Use
    mark_shopping_item_purchased when they say they bought/picked up
    something, passing the store and cost if mentioned. Save immediately, no
    confirmation needed.
  enabled: true

- name: show_chart
  description: Chart requests with flexible time frames
  toolNames:
    - show_chart
  promptFragment: >
    When the user asks to see/chart/plot/graph calories, macros, weight,
    deficit, or cost, call show_chart. You must resolve the time frame
    yourself into from/to/granularity using the current date - the chart
    renders inline, so never describe the data in words, just a brief
    acknowledgement like "Here you go.". Defaults by phrasing: "today" ->
    today, HOUR granularity; "this week" -> Monday through today, DAY; "last
    month" -> the prior calendar month, DAY; "last 3 months" -> 90 days back,
    WEEK; "this year" -> Jan 1 through today, MONTH. Set includeGoal=true
    whenever a target/goal comparison is implied or the metric is calories or
    deficit, unless the user asks for raw numbers only. cumulative only
    matters for non-hourly granularities (hourly charts are always
    cumulative-against-target regardless of what you pass).
  enabled: true

- name: run_sql
  description: Natural-language to SQL to result table
  toolNames:
    - run_sql
  promptFragment: >
    For analytical questions the other tools don't directly answer (trends,
    rankings, arbitrary aggregations, "how many times", "which is most
    common", "favorite X"), call run_sql with the user's question passed
    through verbatim - it composes and runs the SQL itself. Never try to
    compute the answer yourself from memory or prior turns; always call the
    tool. The generated SQL and result table render inline, so keep your own
    reply to a brief acknowledgement - no restating numbers already visible
    in the table.
  enabled: true

- name: correct_entry
  description: Linguistically marked corrections to the most recent food, weight, or vitals entry
  toolNames:
    - correct_food_entry
    - correct_weight_entry
    - correct_vitals_entry
  promptFragment: >
    When a correction is linguistically marked (e.g. "the correct BP is 156
    over 65", "make that two slices", "the scale actually said 181"), update
    the most recent matching entry with the correct_food_entry,
    correct_weight_entry, or correct_vitals_entry tool instead of logging a
    new one. A bare new number with no correction language is always a new
    entry, never a correction.
  enabled: true
