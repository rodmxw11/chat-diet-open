# Loaded by ActuatorConfig, not application.yml - that file is gitignored (it holds the API key)
# and the VM mounts its own copy, so settings committed here reach every environment. Anything in
# application.yml still overrides these.
#
# Every endpoint is exposed: the app is reachable only over the tailnet. The public Funnel
# connector can't reach /actuator - AlexaPathIsolationFilter 404s everything but /alexa there.
management.endpoints.web.exposure.include=*
# A heap dump of a 256 MB heap is a big file to write on the e2-micro, and it holds every live
# object - chat text, health data - in one download. Never exposed, whatever include says.
management.endpoints.web.exposure.exclude=heapdump
management.endpoint.health.show-details=always
management.info.java.enabled=true
management.info.os.enabled=true
management.info.process.enabled=true
