spring:
  application:
    name: backend

  datasource:
    url: jdbc:h2:file:./data/chat-diet
    driver-class-name: org.h2.Driver

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        model: claude-haiku-4-5-20251001
        max-tokens: 1024
