databaseChangeLog:
  - changeSet:
      id: 022-create-food-alias-table
      author: chat-diet
      changes:
        - createTable:
            tableName: food_alias
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: alias_normalized
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: food_item_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: source
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_food_alias_food_item
            tableName: food_alias
            columns:
              - column:
                  name: food_item_id
        # Aliases are not seeded from existing FOOD_ITEM names (rows minted under the old substring
        # matcher would otherwise resolve silently and permanently) - except this one hand-inserted
        # entry for the single existing cached row, verified against the live dev DB.
        - sql:
            sql: >
              INSERT INTO food_alias (alias_normalized, food_item_id, source, created_at)
              SELECT 'orange juice', id, 'MANUAL', CURRENT_TIMESTAMP
              FROM food_item WHERE name = 'orange juice';
