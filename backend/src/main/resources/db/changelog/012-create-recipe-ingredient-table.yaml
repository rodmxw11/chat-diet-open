databaseChangeLog:
  - changeSet:
      id: 012-create-recipe-ingredient-table
      author: chat-diet
      changes:
        - createTable:
            tableName: recipe_ingredient
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: recipe_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: food_item_id
                  type: BIGINT
              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: quantity_g
                  type: DOUBLE
              - column:
                  name: variable_ingredient
                  type: BOOLEAN
                  constraints:
                    nullable: false
