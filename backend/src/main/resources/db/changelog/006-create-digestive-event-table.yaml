databaseChangeLog:
  - changeSet:
      id: 006-create-digestive-event-table
      author: chat-diet
      changes:
        - createTable:
            tableName: digestive_event
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: logged_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: TEXT
