databaseChangeLog:
  - changeSet:
      id: 001-create-note-table
      author: chat-diet
      changes:
        - createTable:
            tableName: note
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: logged_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: text
                  type: TEXT
                  constraints:
                    nullable: false
