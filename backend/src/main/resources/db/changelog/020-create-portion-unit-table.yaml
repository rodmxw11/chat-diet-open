databaseChangeLog:
  - changeSet:
      id: 020-create-portion-unit-table
      author: chat-diet
      changes:
        - createTable:
            tableName: portion_unit
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: food_item_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: unit_name
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: grams
                  type: DOUBLE
                  constraints:
                    nullable: false
              - column:
                  name: source
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_portion_unit_food_item_unit
            tableName: portion_unit
            unique: true
            columns:
              - column:
                  name: food_item_id
              - column:
                  name: unit_name
