databaseChangeLog:
  - changeSet:
      id: 008-create-food-item-table
      author: chat-diet
      changes:
        - createTable:
            tableName: food_item
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: upc
                  type: VARCHAR(32)
                  constraints:
                    unique: true
              - column:
                  name: per100g_calories
                  type: DOUBLE
              - column:
                  name: per100g_protein
                  type: DOUBLE
              - column:
                  name: per100g_carbs
                  type: DOUBLE
              - column:
                  name: per100g_fat
                  type: DOUBLE
              - column:
                  name: typical_serving_g
                  type: DOUBLE
              - column:
                  name: lookup_source
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: use_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: last_used_at
                  type: DATETIME
