databaseChangeLog:
  - changeSet:
      id: 003-create-weight-entry-table
      author: chat-diet
      changes:
        - createTable:
            tableName: weight_entry
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: logged_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: weight_lbs
                  type: DOUBLE
                  constraints:
                    nullable: false
              - column:
                  name: corrected_at
                  type: DATETIME
