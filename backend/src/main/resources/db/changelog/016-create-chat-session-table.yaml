databaseChangeLog:
  - changeSet:
      id: 016-create-chat-session-table
      author: chat-diet
      changes:
        - createTable:
            tableName: chat_session
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: session_key
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: started_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: ended_at
                  type: DATETIME
              - column:
                  name: token_estimate
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: size_warned
                  type: BOOLEAN
                  constraints:
                    nullable: false
