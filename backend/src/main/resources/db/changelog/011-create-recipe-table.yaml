databaseChangeLog:
  - changeSet:
      id: 011-create-recipe-table
      author: chat-diet
      changes:
        - createTable:
            tableName: recipe
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: per100g_calories
                  type: DOUBLE
              - column:
                  name: per100g_protein
                  type: DOUBLE
              - column:
                  name: per100g_carbs
                  type: DOUBLE
              - column:
                  name: per100g_fat
                  type: DOUBLE
              - column:
                  name: typical_serving_g
                  type: DOUBLE
              - column:
                  name: total_yield_g
                  type: DOUBLE
              - column:
                  name: provisional
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: use_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: last_used_at
                  type: DATETIME
