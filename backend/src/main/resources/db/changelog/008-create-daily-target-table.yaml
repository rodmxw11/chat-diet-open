databaseChangeLog:
  - changeSet:
      id: 008-create-daily-target-table
      author: chat-diet
      changes:
        - createTable:
            tableName: daily_target
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: target_date
                  type: DATE
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: target_calories
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: effective_tdee
                  type: DOUBLE
                  constraints:
                    nullable: false
              - column:
                  name: weight_lbs_used
                  type: DOUBLE
                  constraints:
                    nullable: false
