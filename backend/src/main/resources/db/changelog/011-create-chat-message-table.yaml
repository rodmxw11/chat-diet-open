databaseChangeLog:
  - changeSet:
      id: 011-create-chat-message-table
      author: chat-diet
      changes:
        - createTable:
            tableName: chat_message
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: metabolic_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: CLOB
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - createIndex:
            tableName: chat_message
            indexName: idx_chat_message_metabolic_date
            columns:
              - column:
                  name: metabolic_date
              - column:
                  name: created_at
