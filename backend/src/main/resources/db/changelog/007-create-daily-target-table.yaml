databaseChangeLog:
  - changeSet:
      id: 007-create-daily-target-table
      author: chat-diet
      changes:
        - createTable:
            tableName: daily_target
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: target_date
                  type: DATE
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: target_calories
                  type: INT
                  constraints:
                    nullable: false
