import org.gradle.internal.os.OperatingSystem

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.chatdiet'
version = '0.0.1-SNAPSHOT'

// Short commit hash baked into build-info.properties below, for the About page. Falls back
// gracefully (e.g. a shallow clone or a source tarball with no .git directory) rather than
// failing the build.
def gitCommit
try {
    gitCommit = providers.exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
    }.standardOutput.asText.get().trim()
} catch (Exception ignored) {
    gitCommit = 'unknown'
}

// Writes META-INF/build-info.properties (name/version/build time, plus the git commit above) into
// the jar - Spring Boot's ProjectInfoAutoConfiguration picks it up as a BuildProperties bean with
// no extra dependency (doesn't require Actuator). Consumed by AboutService for the About page.
springBoot {
    buildInfo {
        properties {
            additional = ['git.commit': gitCommit]
        }
    }
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.0")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
	implementation 'com.google.zxing:core:3.5.3'
	implementation 'com.google.zxing:javase:3.5.3'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'
	implementation 'org.xerial:sqlite-jdbc:3.47.1.0'
	implementation 'org.apache.commons:commons-text:1.13.0'
	// Alexa skill request signature/timestamp verification (backend/src/main/java/com/chatdiet/alexa).
	// Note the groupId is com.amazon.alexa, not com.amazon.ask - the Java package name (com.amazon.ask.*)
	// doesn't match the Maven coordinates. ask-sdk-servlet-support's ServletRequest convenience class
	// depends on javax.servlet-api (provided scope, Jakarta-incompatible) - deliberately unused here;
	// AlexaSignatureFilter implements the SDK's AlexaHttpRequest interface directly instead, which has
	// no servlet-api dependency of its own.
	implementation 'com.amazon.alexa:ask-sdk-core:2.86.0'
	implementation 'com.amazon.alexa:ask-sdk-servlet-support:2.86.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('dockerBuild', Exec) {
	group = 'docker'
	description = 'Builds the chat-diet-backend Docker image from the compiled jar.'
	dependsOn tasks.named('bootJar')
	workingDir = projectDir
	commandLine 'docker', 'build', '-t', 'chat-diet-backend', '.'
}

def frontendDir = file('../frontend')
def npmExecutable = OperatingSystem.current().isWindows() ? 'npm.cmd' : 'npm'

tasks.register('installFrontendDeps', Exec) {
	group = 'frontend'
	description = 'Installs frontend npm dependencies.'
	workingDir = frontendDir
	commandLine npmExecutable, 'install'
	inputs.file("${frontendDir}/package.json")
	inputs.file("${frontendDir}/package-lock.json")
	outputs.dir("${frontendDir}/node_modules")
}

tasks.register('buildFrontend', Exec) {
	group = 'frontend'
	description = 'Builds the frontend production bundle (npm run build).'
	dependsOn tasks.named('installFrontendDeps')
	workingDir = frontendDir
	commandLine npmExecutable, 'run', 'build'
	inputs.dir("${frontendDir}/src")
	inputs.dir("${frontendDir}/public")
	inputs.file("${frontendDir}/vite.config.ts")
	inputs.file("${frontendDir}/index.html")
	outputs.dir("${frontendDir}/dist")
}

// Bundles the built frontend into the jar's static resources so Spring Boot serves the
// whole app (UI + API) from one origin/port - required for the PWA service worker to see
// /api/* as same-origin, and to give the phone a single HTTPS endpoint over Tailscale.
tasks.named('processResources') {
	dependsOn tasks.named('buildFrontend')
	from(frontendDir.toPath().resolve('dist')) {
		into 'static'
	}
}
