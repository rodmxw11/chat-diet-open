<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="chat-diet">
  <!-- Tab-sized mark, deliberately blunter than the PWA icon. Three things make it survive a
       16px render, and all three were what the old downscaled PNG got wrong: the canvas is
       filled edge to edge instead of floating a hairline outline on white, the plate is a
       solid disc rather than a thin ring whose hole closes up, and there is no lettering.
       Drawn as a vector so the tab rasterizes it directly instead of shrinking a 192px bitmap.
       The detailed mark still ships as chat-diet-icon-192/512.png for the home screen, where
       there are enough pixels to carry it. -->
  <rect width="32" height="32" rx="7" fill="#aa3bff"/>
  <circle cx="16" cy="16" r="11.6" fill="#fff"/>
  <g fill="#aa3bff">
    <path d="M11.9 5.9h8.2v6.6a4.1 4.1 0 0 1-4.1 4.1 4.1 4.1 0 0 1-4.1-4.1z"/>
    <rect x="14.5" y="15" width="3" height="11.2" rx="1.5"/>
  </g>
  <!-- Tine slots, cut back to the disc. They fall below a pixel in the tab and simply close
       up, leaving a clean fork silhouette rather than a smear. -->
  <g fill="#fff">
    <rect x="14.05" y="5.9" width="1.25" height="5.6"/>
    <rect x="16.7" y="5.9" width="1.25" height="5.6"/>
  </g>
</svg>
